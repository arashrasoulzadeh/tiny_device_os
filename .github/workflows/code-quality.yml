name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy libsdl2-dev portaudio19-dev
      
      - name: Run clang-tidy
        run: |
          cmake -B build -DARDUBOT_BUILD_SIM=ON -DCMAKE_C_CLANG_TIDY=clang-tidy
          cmake --build build 2>&1 | tee clang-tidy.log
      
      - name: Check for clang-tidy errors
        run: |
          if grep -E 'error:.*\[clang' clang-tidy.log; then
            echo "clang-tidy found errors"
            exit 1
          fi