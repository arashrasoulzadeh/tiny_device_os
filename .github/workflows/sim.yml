name: Simulator Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  sim-test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev portaudio19-dev lcov cmake gcc g++
      
      - name: Configure CMake
        run: cmake -B build -DARDUBOT_BUILD_SIM=ON -DCMAKE_BUILD_TYPE=Debug
      
      - name: Build
        run: cmake --build build -- -j$(nproc)
      
      - name: Run tests
        run: |
          cd build
          cp sim/ardubot-sim ./ardubot-sim 2>/dev/null || true
          ./ardubot-sim --headless --test=all --junit=results.xml --coverage=coverage.info
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ubuntu
          path: build/coverage.info

  sim-test-windows:
    runs-on: windows-latest
    env:
      SDL_RENDER_DRIVER: software
      VCPKG_ROOT: C:/vcpkg
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup vcpkg
        uses: lukka/get-vcpkg@v2
      
      - name: Install dependencies
        run: |
          vcpkg install sdl2 portaudio --triplet=x64-windows
          choco install cmake mingw -y
          refreshenv
      
      - name: Configure CMake
        run: cmake -B build -DARDUBOT_BUILD_SIM=ON -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: cmake --build build --config Release -j
      
      - name: Run tests
        run: |
          cd build
          cp sim/Release/ardubot-sim.exe ./ardubot-sim.exe 2>/dev/null || true
          ./ardubot-sim.exe --headless --test=all --junit=results.xml
      
      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        with:
          name: junit-windows
          path: build/results.xml

  sim-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          brew install sdl2 portaudio cmake lcov
      
      - name: Configure CMake
        run: cmake -B build -DARDUBOT_BUILD_SIM=ON -DCMAKE_BUILD_TYPE=Debug
      
      - name: Build
        run: cmake --build build -- -j$(sysctl -n hw.ncpu)
      
      - name: Run tests
        run: |
          cd build
          cp sim/ardubot-sim ./ardubot-sim 2>/dev/null || true
          ./ardubot-sim --headless --test=all --junit=results.xml
      
      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        with:
          name: junit-macos
          path: build/results.xml