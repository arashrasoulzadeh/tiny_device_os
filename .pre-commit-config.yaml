repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format
        language: system
        args: ['-i', '--style=file']
        files: '\.(c|h|cpp|hpp)$'

      - id: tdd-check
        name: TDD Check - Test must exist before implementation
        entry: python3 scripts/tdd_check.py
        language: system
        types: [c]
        args: ['--staged']
        pass_filenames: false
        always_run: true
        verbose: true

      - id: cmake-format
        name: Format CMake files
        entry: cmake-format
        language: system
        types: [cmake]
        args: ['-i']
