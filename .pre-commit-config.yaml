repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-logger
      - id: check-case-conflict

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: clang-format
        args: ['--style=file']
        files: '\.(c|h)$'

  - repo: local
    hooks:
      - id: tdd-check
        name: TDD Check - Test must exist before implementation
        entry: python3 scripts/tdd_check.py
        language: system
        types: [c]
        args: ['--staged']
        always_run: true
        verbose: true

      - id: cmake-format
        name: Format CMake files
        entry: cmake-format
        language: system
        types: [cmake]
        args: ['-i']

      - id: kconfig-lint
        name: Validate Kconfig
        entry: python3 -m kconfiglib
        language: system
        types: [kconfig]
        args: ['Kconfig']