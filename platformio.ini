; PlatformIO project for USB flash (`make usb`)
; Docs: https://platformio.org/
;
; device_config.yaml → build/generated/device_config.h (pins, LCD size)
; device_secrets.yaml → build/generated/device_secrets.h (Wi-Fi ssid/password)
; scripts/usb_flash.py runs: platformio run -e <env> -t upload
;
; No lib_deps — SSD1306 driver is local (boards/nodemcu/src/ssd1306_mini.h)
; so flaky registry mirrors cannot block the build.

[platformio]
default_envs = nodemcu
src_dir = boards/nodemcu/src
include_dir = build/generated

; ---------------------------------------------------------------------------
; NodeMCU (ESP8266) — primary connected board
; ---------------------------------------------------------------------------
[env:nodemcu]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; Arduino-like auto-reset via scripts/nodemcu_upload.py (survives CH340 DTR drops)
upload_protocol = custom
upload_speed = 115200
upload_command = python3 $PROJECT_DIR/scripts/nodemcu_upload.py --port $UPLOAD_PORT --firmware $SOURCE --baud $UPLOAD_SPEED
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
board_build.ldscript = eagle.flash.4m.ld
build_flags =
	-Wl,-Map=.pio/build/nodemcu/firmware.map
	-Ibuild/generated
	-Ikernel
	-Ihal/include
	-Iapps
	-Iapps/ui/components
	-Isim
	-Isim/models
	-Ilink
	-Idrivers
	-Ifs
	-Ifs/littlefs
	-Ithird_party/littlefs
	-DARDUBOT_PIO=1
	-DARDUBOT_TARGET_ESP8266=1
	-DAPP_DISPLAY_WIDTH=128
	-DAPP_DISPLAY_HEIGHT=32
	-DARDUBOT_UI_PADDING=10
	-DARDUBOT_DEFAULT_FPS=10
	-DLFS_READ_SIZE=16
	-DLFS_PROG_SIZE=16
	-DLFS_BLOCK_SIZE=4096
	-DLFS_LOOKAHEAD=16
	-DLFS_CACHE_SIZE=16
extra_scripts =
	pre:scripts/pio_enabled_apps.py
	pre:scripts/pio_app_manifest.py
	pre:scripts/pio_build_info.py
; scheduler_esp32.c is FreeRTOS; ESP8266 Arduino uses the generic scheduler.c
; with host_stack.c (Xtensa impl). hal_display_esp8266_arduino.cpp is the
; SSD1306 I2C driver. sim_gpio.c is the portable key table app_kit binds to.
build_src_filter =
	-<*>
	+<kernel_boot.cpp>
	+<../../../kernel/scheduler.c>
	+<../../../kernel/host_stack.c>
	+<../../../kernel/os_time.c>
	+<../../../kernel/os_clock.c>
	+<../../../kernel/alloc.c>
	+<../../../kernel/event.c>
	+<../../../kernel/power.c>
	+<../../../kernel/power_governor.c>
	+<../../../hal/arch/esp8266/hal_display_esp8266_arduino.cpp>
	+<../../../hal/arch/esp8266/hal_gpio_esp8266_arduino.cpp>
	+<../../../hal/arch/esp8266/hal_power_esp8266_arduino.cpp>
	+<../../../hal/arch/esp8266/hal_storage_esp8266_arduino.cpp>
	+<../../../hal/arch/esp8266/hal_i2c_esp8266_arduino.cpp>
	+<../../../hal/arch/esp8266/hal_adc_esp8266_arduino.cpp>
	+<../../../sim/sim_gpio.c>
	+<../../../apps/syscall.c>
	+<../../../apps/app.c>
	+<../../../apps/app_utils.c>
	+<../../../apps/app_kit.c>
	+<../../../apps/ardubot_keys.c>
	+<../../../apps/device_info.c>
	+<../../../apps/stdlog.c>
	+<../../../apps/fw/ui.c>
	+<../../../apps/app_ui.c>
	+<../../../apps/app_helper.c>
	+<../../../apps/boot_splash.c>
	+<../../../apps/os_boot.c>
	+<../../../apps/app_manifest.c>
	+<../../../apps/app_runtime.c>
	+<../../../apps/clock_service.c>
	+<../../../apps/sensor_service.c>
	+<../../../apps/notify_service.c>
	+<../../../apps/link_bridge.c>
	+<../../../apps/tty_service.c>
	+<../../../apps/input.c>
	+<../../../apps/ui.c>
	+<../../../apps/stdapps_register.c>
	+<../../../apps/ui/components/canvas.c>
	+<../../../apps/ui/components/menu.c>
	+<../../../apps/ui/components/catalog.c>
	+<../../../apps/ui/components/icons.c>
	+<../../../apps/ui/components/status.c>
	+<../../../apps/header_app.c>
	+<../../../fs/vfs.c>
	+<../../../fs/littlefs/littlefs_vfs.c>
	+<../../../third_party/littlefs/lfs.c>
	+<../../../third_party/littlefs/lfs_util.c>

; ---------------------------------------------------------------------------
; ESP32 DevKit (optional — same src until a dedicated board tree exists)
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
	-Ibuild/generated
	-DARDUBOT_PIO=1
	-DARDUBOT_TARGET_ESP32=1

; ---------------------------------------------------------------------------
; ESP32-C6-LCD-1.47. Apps come only from apps/stdapps/ (stdapps_install).
; Board entry is src_kernel/kernel_boot.cpp — it does not draw apps itself.
; ---------------------------------------------------------------------------
[env:esp32-c6]
; Official platformio/espressif32 lacks an Arduino build script for ESP32-C6;
; pioarduino (community fork) ships it — https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-lcd-147
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 4MB
board_build.partitions = boards/esp32-c6-lcd/partitions.csv
lib_deps =
	moononournation/GFX Library for Arduino@^1.4.7
build_flags =
	-Ibuild/generated
	-Ikernel
	-Ihal/include
	-Iapps
	-Iapps/ui/components
	-Isim
	-Isim/models
	-Ilink
	-Idrivers
	-Ifs
	-Ifs/littlefs
	-Ithird_party/littlefs
	-DARDUBOT_PIO=1
	-DARDUBOT_TARGET_ESP32=1
; Native USB-CDC. Without this, Serial never reaches the USB-Serial/JTAG port.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DAPP_DISPLAY_WIDTH=320
	-DAPP_DISPLAY_HEIGHT=172
	-DARDUBOT_UI_PADDING=16
	-DARDUBOT_DEFAULT_FPS=10
	-DLFS_READ_SIZE=16
	-DLFS_PROG_SIZE=16
	-DLFS_BLOCK_SIZE=4096
	-DLFS_LOOKAHEAD=16
	-DLFS_CACHE_SIZE=16
extra_scripts =
	pre:scripts/pio_enabled_apps.py
	pre:scripts/pio_app_manifest.py
	pre:scripts/pio_build_info.py
; scheduler_esp32.c (real FreeRTOS tasks). hal_display_esp32_arduino.cpp is
; the ST7789 driver. sim_gpio.c is the portable key table app_kit binds to.
build_src_filter =
	-<*>
	+<../../esp32-c6-lcd/src_kernel/kernel_boot.cpp>
	+<../../../kernel/scheduler_esp32.c>
	+<../../../hal/arch/esp32/hal_display_esp32_arduino.cpp>
	+<../../../hal/display_fb.c>
	+<../../../hal/arch/esp32/hal_gpio_esp32.c>
	+<../../../sim/sim_gpio.c>
	+<../../../apps/syscall.c>
	+<../../../apps/app.c>
	+<../../../apps/app_utils.c>
	+<../../../apps/app_kit.c>
	+<../../../apps/ardubot_keys.c>
	+<../../../apps/device_info.c>
	+<../../../apps/stdlog.c>
	+<../../../apps/fw/ui.c>
	+<../../../apps/app_ui.c>
	+<../../../apps/app_helper.c>
	+<../../../apps/boot_splash.c>
	+<../../../apps/os_boot.c>
	+<../../../apps/app_manifest.c>
	+<../../../apps/app_runtime.c>
	+<../../../apps/clock_service.c>
	+<../../../apps/sensor_service.c>
	+<../../../apps/notify_service.c>
	+<../../../apps/link_bridge.c>
	+<../../../apps/tty_service.c>
	+<../../../link/link_frame.c>
	+<../../../link/link_crypto.c>
	+<../../../link/link_session.c>
	+<../../../link/link_dispatch.c>
	+<../../../apps/input.c>
	+<../../../apps/ui.c>
	+<../../../apps/stdapps_register.c>
	+<../../../apps/ui/components/canvas.c>
	+<../../../apps/ui/components/menu.c>
	+<../../../apps/ui/components/catalog.c>
	+<../../../apps/ui/components/icons.c>
	+<../../../apps/ui/components/status.c>
	+<../../../apps/header_app.c>
	+<../../../kernel/os_time.c>
	+<../../../kernel/os_clock.c>
	+<../../../fs/vfs.c>
	+<../../../fs/littlefs/littlefs_vfs.c>
	+<../../../third_party/littlefs/lfs.c>
	+<../../../third_party/littlefs/lfs_util.c>
	+<../../../hal/arch/esp32/hal_storage_esp32.c>
	+<../../../kernel/alloc.c>
	+<../../../kernel/event.c>
	+<../../../kernel/power.c>
	+<../../../kernel/power_governor.c>
	+<../../../hal/arch/esp32/hal_power_esp32.c>

; Same firmware as [env:esp32-c6]. Kept so an older `pio run -e esp32-c6-kernel`
; still builds the apps/stdapps image.
[env:esp32-c6-kernel]
extends = env:esp32-c6

; ---------------------------------------------------------------------------
; Mega2560 / Pico placeholders (upload only once board src is ready)
; ---------------------------------------------------------------------------
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
	-Ibuild/generated
	-DARDUBOT_PIO=1

[env:pico]
platform = raspberrypi
board = pico
framework = arduino
build_flags =
	-Ibuild/generated
	-DARDUBOT_PIO=1
