; PlatformIO project for USB flash (`make usb`)
; Docs: https://platformio.org/
;
; device_config.yaml → build/generated/device_config.h (pins, LCD size)
; device_secrets.yaml → build/generated/device_secrets.h (Wi-Fi ssid/password)
; scripts/usb_flash.py runs: platformio run -e <env> -t upload
;
; No lib_deps — SSD1306 driver is local (boards/nodemcu/src/ssd1306_mini.h)
; so flaky registry mirrors cannot block the build.

[platformio]
default_envs = nodemcu
src_dir = boards/nodemcu/src
include_dir = build/generated

; ---------------------------------------------------------------------------
; NodeMCU (ESP8266) — primary connected board
; ---------------------------------------------------------------------------
[env:nodemcu]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; Arduino-like auto-reset via scripts/nodemcu_upload.py (survives CH340 DTR drops)
upload_protocol = custom
upload_speed = 115200
upload_command = python3 $PROJECT_DIR/scripts/nodemcu_upload.py --port $UPLOAD_PORT --firmware $SOURCE --baud $UPLOAD_SPEED
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
build_flags =
	-Ibuild/generated
	-Iapps/ui/components
	-Iapps/stdapps/pong
	-DARDUBOT_PIO=1
	-DARDUBOT_TARGET_ESP8266=1
build_src_filter =
	+<*>
	+<../../../apps/ui/components/icons.c>
	+<../../../apps/ui/components/status.c>
	+<../../../apps/stdapps/counter/counter_icon.c>
	+<../../../apps/stdapps/info/info_icon.c>
	+<../../../apps/stdapps/stopwatch/stopwatch_icon.c>
	+<../../../apps/stdapps/pong/pong.c>
	+<../../../apps/stdapps/pong/pong_icon.c>

; ---------------------------------------------------------------------------
; ESP32 DevKit (optional — same src until a dedicated board tree exists)
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
	-Ibuild/generated
	-DARDUBOT_PIO=1
	-DARDUBOT_TARGET_ESP32=1

; ---------------------------------------------------------------------------
; ESP32-C6 DevKit (native USB-Serial/JTAG — no CH340/CP210x bridge)
; ESP32-C6-LCD-1.47: ST7789 172x320 color panel, landscape, full launcher +
; app suite (counter/info/stopwatch/pong/tasks/pomodoro) via GfxMono
; (boards/esp32-c6-lcd/src/gfx_mono.h) — a standalone Arduino sketch, not
; wired into the kernel/HAL (see RISCV_TODO.md for what that would take).
; ---------------------------------------------------------------------------
[env:esp32-c6]
; Official platformio/espressif32 lacks an Arduino build script for ESP32-C6;
; pioarduino (community fork) ships it — https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-lcd-147
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
	moononournation/GFX Library for Arduino@^1.4.7
build_flags =
	-Ibuild/generated
	-Iapps/ui/components
	-Iapps/stdapps/pong
	-DARDUBOT_PIO=1
	-DARDUBOT_TARGET_ESP32=1
; ESP32-C6 has no separate USB-UART bridge chip - without this, Serial
; doesn't route to the native USB-CDC port at all, so every Serial.print()
; in this sketch (including the button wiring-check diagnostic) silently
; goes nowhere and a serial monitor opened on this port only ever shows the
; mask-ROM bootloader banner, never anything the app itself prints.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
; must match device_config_esp32c6.yaml's lcd.width/height (GfxMono's
; rotated, full-screen canvas) — pong's playfield size comes from these,
; not from device_config.h.
	-DAPP_DISPLAY_WIDTH=320
	-DAPP_DISPLAY_HEIGHT=172
; global src_dir is boards/nodemcu/src — swap in the ESP32-C6-LCD main instead
; Icons are drawn as real multi-color vector shapes directly in main.cpp
; (icon_counter/icon_info/icon_stopwatch/icon_pong), not via the shared
; 1-bit apps/ui/components/icons.c bitmap format — so none of the *_icon.c
; files or icons.c itself are needed here. pong.c is still pulled in for
; the actual game logic (pong_step/pong_reset/...), just not its icon.
build_src_filter =
	-<*>
	+<../../esp32-c6-lcd/src/main.cpp>
	+<../../../apps/ui/components/status.c>
	+<../../../apps/stdapps/pong/pong.c>

; ---------------------------------------------------------------------------
; Mega2560 / Pico placeholders (upload only once board src is ready)
; ---------------------------------------------------------------------------
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
	-Ibuild/generated
	-DARDUBOT_PIO=1

[env:pico]
platform = raspberrypi
board = pico
framework = arduino
build_flags =
	-Ibuild/generated
	-DARDUBOT_PIO=1
