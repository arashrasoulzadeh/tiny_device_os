# ArdubotOS connected-device profile for the Waveshare ESP32-C6-LCD-1.47.
# Native USB-Serial/JTAG — port stays /dev/cu.usbmodem* and needs no CH340 reset dance.
# Use: make usb DEVICE_CONFIG=device_config_esp32c6.yaml DEVICE=esp32-c6
#
# The onboard ST7789 SPI panel (172x320 native/portrait; mosi/sclk/cs/dc/rst/bl
# below — shared SPI bus pins mosi/sclk are also used by the TF card) runs the
# same launcher as boards/nodemcu/src/main.cpp via the GfxMono adapter
# (boards/esp32-c6-lcd/src/gfx_mono.h), rotated to landscape (320x172 physical).
# The 5x7 font / 16x16 icons were sized for a 128x64-ish OLED, so lcd.scale
# draws each logical pixel as an NxN block, and lcd.padding keeps a margin
# clear of the panel's edges/corners: width*scale + 2*padding and
# height*scale + 2*padding must equal the physical landscape size (320x172)
# for the canvas to be centered with an even border and no overflow.
# lcd.width/height below must ALSO match the APP_DISPLAY_WIDTH/
# APP_DISPLAY_HEIGHT build_flags in platformio.ini's esp32-c6 env (pong's
# playfield size comes from those flags, not this file) — change all four
# (width, height, scale, padding) together if you resize.
#
# UP/SELECT buttons are NOT onboard — wire them yourself to GND with
# INPUT_PULLUP (active_low: true). GPIO18/19 below are free on this board's
# header (GPIO4/5 are taken by the TF card, GPIO9 is the onboard BOOT
# button, GPIO6/7/14/15/21/22 are taken by the LCD) — change the `pin:`
# values here if you wire to different pins.

device:
  name: esp32-c6
  arch: esp32
  board: esp32-c6-lcd-147
  pio_env: esp32-c6
  port: auto
  baud: 115200
  flash_baud: 460800
  flash_size: 4MB
  flash_mode: dio

lcd:
  type: st7789
  bus: spi
  width: 320
  height: 172
  scale: 1
  padding: 0
  mosi: GPIO6
  sclk: GPIO7
  cs: GPIO14
  dc: GPIO15
  rst: GPIO21
  bl: GPIO22

# Real-kernel app framework (RISCV_TODO.md Phase 4+, [env:esp32-c6-kernel])
# config - NOT the same "padding" as lcd.padding above, which is the OLD
# main.cpp/gfx_mono.h sketch's own canvas-centering math
# (width*scale + 2*padding == physical size) and has nothing to do with
# apps/app_ui.c. This section's values aren't run through the yaml->
# generated-header pipeline yet - platformio.ini's [env:esp32-c6-kernel]
# build_flags mirror them manually (same pattern it already uses for
# APP_DISPLAY_WIDTH/HEIGHT below) - change both together.
app_kit:
  # Content inset in pixels on every side of a standard app: left, right,
  # under the title bar, and above the help bar (app_ui_config_ui).
  # Panels taller than 64px already default to 16; this line is the board
  # override, mirrored by -DARDUBOT_UI_PADDING in platformio.ini.
  ui_padding: 16
  # Default app frame rate (Hz) for any app whose own manifest doesn't
  # set .fps (apps/app_kit.c's app_kit_run) - an app can always ask for
  # a higher (or lower) rate itself via APP_DEFINE's .fps field, which
  # always wins over this default.
  default_fps: 10

# Wall clock installed at boot when the board's clock is unset.
# Leave this out and `make usb` stamps your computer's time and timezone.
# Set unix (seconds since 1970) to pin a time instead:
# clock:
#   unix: 1700000000
#   tz_offset_min: 210

# On-chip temperature. The sensors app lists every entry here.
# type temp is decidegrees Celsius (25.3 C is stored as 253).
# Add an adc entry with path: /dev/adcN when a pin is wired.
sensors:
  - key: temp
    type: temp
    refresh_ms: 1000

inputs:
  buttons:
    - name: up
      pin: GPIO18      # navigate / + / toggle — wire to GND, free on header
      active_low: true
      pull: up
    - name: select
      pin: GPIO19      # launch / − / reset; hold ~0.7s = back — wire to GND
      active_low: true
      pull: up

outputs:
  leds: []
  sound: null

# After a successful `make usb`, stay in this process and forward host
# lines to the board until Ctrl+C. The key lives in device_secrets.yaml.
notifications:
  forward_from_host: true
