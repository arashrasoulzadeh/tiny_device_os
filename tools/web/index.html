<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArdubotOS Web Flash Console</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ArdubotOS Web Flash Console</h1>
            <nav class="nav">
                <button class="nav-btn active" id="nav-devices" data-screen="devices">Devices</button>
                <button class="nav-btn" id="nav-device" data-screen="device">Device</button>
                <button class="nav-btn" id="nav-image" data-screen="image">Image</button>
                <button class="nav-btn" id="nav-job" data-screen="job">Job</button>
                <button class="nav-btn" id="nav-console" data-screen="console">Console</button>
            </nav>
        </header>

        <!-- Devices Screen -->
        <section id="screen-devices" class="screen active">
            <h2>USB Devices</h2>
            <div id="devices-list" class="card">
                <p>Loading...</p>
            </div>
        </section>

        <!-- Device Info Screen -->
        <section id="screen-device" class="screen hidden">
            <h2>Device Info</h2>
            <div id="device-info">
                <p>Loading...</p>
            </div>
        </section>

        <!-- Image Screen -->
        <section id="screen-image" class="screen hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2>Image Configuration</h2>
                <div class="actions">
                    <button class="btn primary" onclick="startJob(false)">Build</button>
                    <button class="btn primary" onclick="startJob(true)">Build & Flash</button>
                </div>
            </div>
            
            <div class="card">
                <h3>Applications</h3>
                <div id="apps-list" class="apps-list">
                    <p>Loading...</p>
                </div>
            </div>
            
            <div class="card">
                <h3>Main App</h3>
                <select id="main-app-select" onchange="saveMainApp()">
                    <option value="launcher">Launcher</option>
                </select>
            </div>
            
            <div class="card">
                <h3>Features</h3>
                <div id="features-list" class="features-list">
                    <p>Loading...</p>
                </div>
            </div>
            
            <div class="card">
                <h3>Size Preview</h3>
                <div id="size-preview">
                    <p>Loading...</p>
                </div>
            </div>
        </section>

        <!-- Job Screen -->
        <section id="screen-job" class="screen hidden">
            <h2>Build / Flash Job</h2>
            <div id="job-status">
                <p>Loading...</p>
            </div>
        </section>

        <!-- Console Screen -->
        <section id="screen-console" class="screen hidden">
            <h2>Console</h2>
            <div id="console-container">
                <p>Loading...</p>
            </div>
        </section>
    </div>

    <script src="/app.js"></script>
</body>
</html>
