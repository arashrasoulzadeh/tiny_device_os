# ArdubotOS device profile: NodeMCU + color OLED/EC11 rotary-encoder module
# (shop.ideaelec.com "color OLED display module with EC11 rotary encoder").
# A separate device profile from device_config.yaml — does not replace it.
#
# Use: make usb DEVICE_CONFIG=device_config_nodemcu_rotator.yaml DEVICE=nodemcu
#
# IdeaElec 1.3" color OLED + EC11 (IE2-13A06): 128x64, I2C, 3.3V.
# That size is an SH1106 (132 columns, visible window at col_offset 2).
# SSD1306 horizontal addressing only writes page 0. 64 rows need
# alternative COM (0x12); sequential COM (0x02) draws the picture short.
# lcd.type/width/height/col_offset below are baked into device_config.h
# and select ssd1306_mini.h's page-addressing path. col_offset 2 is the
# common SH1106 default — nudge it if the image is shifted sideways.
#
# EC11 encoder: ENCODER-A/ENCODER-B (quadrature) + ENCODER-PUSH (button).
# Listed below as three plain digital inputs (inputs.buttons); main.cpp
# detects the encoder_a/encoder_b/encoder_push names (ARDUBOT_HAS_ENCODER)
# and does real quadrature decoding — CW detent = on_up(), CCW = on_down(),
# push = select/long-press-back. One step per physical click, not per
# raw A/B edge.

device:
  name: nodemcu-rotator
  arch: esp8266
  board: nodemcu
  pio_env: nodemcu
  port: auto
  baud: 115200
  flash_baud: 460800
  flash_size: 4MB
  flash_mode: dio

lcd:
  type: sh1106
  width: 128
  height: 64
  bus: i2c
  address: 0x3C
  col_offset: 2
  # Same I2C pins as the default nodemcu profile. Do NOT use D0 (GPIO16):
  # Wire/I2C fails there.
  scl: D1   # GPIO5
  sda: D2   # GPIO4

inputs:
  buttons:
    - name: encoder_a
      pin: D5          # GPIO14 — EC11 ENCODER-A
      active_low: true
      pull: up
    - name: encoder_b
      pin: D6          # GPIO12 — EC11 ENCODER-B
      active_low: true
      pull: up
    - name: encoder_push
      pin: D7          # GPIO13 — EC11 ENCODER-PUSH
      active_low: true
      pull: up

outputs:
  leds: []
  sound: null

# CPU frequency (MHz) - ESP8266 max is 160 (overclocked)
cpu:
  max_freq_mhz: 160
