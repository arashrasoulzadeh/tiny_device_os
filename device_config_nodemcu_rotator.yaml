# ArdubotOS device profile: NodeMCU + color OLED/EC11 rotary-encoder module
# (shop.ideaelec.com "color OLED display module with EC11 rotary encoder").
# A separate device profile from device_config.yaml — does not replace it.
#
# Use: make usb DEVICE_CONFIG=device_config_nodemcu_rotator.yaml DEVICE=nodemcu
#
# Panel is marked "DST-013", 1.3" 128x64 — that size/resolution combo is
# almost always SH1106, not SSD1306 (confirmed: SSD1306 init only lit the
# top page because SH1106 doesn't support SSD1306's horizontal-addressing
# commands). ssd1306_mini.h now has an SH1106 page-addressing path, selected
# via lcd.type: sh1106 below. col_offset 2 is the common SH1106 default —
# nudge it if the image is shifted sideways.
#
# EC11 encoder: ENCODER-A/ENCODER-B (quadrature) + ENCODER-PUSH (button).
# Listed below as three plain digital inputs (inputs.buttons); main.cpp
# detects the encoder_a/encoder_b/encoder_push names (ARDUBOT_HAS_ENCODER)
# and does real quadrature decoding — CW detent = on_up(), CCW = on_down(),
# push = select/long-press-back. One step per physical click, not per
# raw A/B edge.

device:
  name: nodemcu-rotator
  arch: esp8266
  board: nodemcu
  pio_env: nodemcu
  port: auto
  baud: 115200
  flash_baud: 460800
  flash_size: 4MB
  flash_mode: dio

lcd:
  type: sh1106
  width: 128
  height: 64
  bus: i2c
  address: 0x3C
  col_offset: 2
  # Same I2C pins as the default nodemcu profile. Do NOT use D0 (GPIO16):
  # Wire/I2C fails there.
  scl: D1   # GPIO5
  sda: D2   # GPIO4

inputs:
  buttons:
    - name: encoder_a
      pin: D5          # GPIO14 — EC11 ENCODER-A
      active_low: true
      pull: up
    - name: encoder_b
      pin: D6          # GPIO12 — EC11 ENCODER-B
      active_low: true
      pull: up
    - name: encoder_push
      pin: D7          # GPIO13 — EC11 ENCODER-PUSH
      active_low: true
      pull: up

outputs:
  leds: []
  sound: null
