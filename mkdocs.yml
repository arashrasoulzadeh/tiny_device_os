site_name: ArdubotOS
site_url: https://arashrasoulzadeh.github.io/tiny_device_os/
docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Agent Guide: agent-guide.md
  - App Kit: appkit.md
  - Apps: apps.md
  - Tutorial - Writing an App: tutorials/writing-an-app.md

theme:
  name: readthedocs

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - js/mermaid-init.js
